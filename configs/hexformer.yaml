# Tile Transformer (HexFormer) + adaptive curriculum + redesigned reward.
#
# Builds on v2 (lr 1e-4 + 1M warmup + ent_coef 0.02, which fixed the optimization).
# New in v3:
#   1. ADAPTIVE OPPONENT CURRICULUM (sampler: adaptive). 50% self (best-past
#      snapshot, always ~winnable); the rest on the <=2 contestable rungs of the
#      ladder weighted->value->alphabeta1->alphabeta2 (by recent eval winrate),
#      + a 5% floor on the next rung. No 'random'. Window slides up as rungs are
#      mastered. Driven by the callback eval winrates (now incl. AB1/AB2).
#   2. REDESIGNED DENSE REWARD. Stronger placement pull + combined-coverage
#      diversity; robber pip-scaled (+opp/-self/+steal); roads & maritime priced
#      (use-properly, not avoid); bigger settlement/city bonuses; stronger discard
#      penalty. Efficiency/robber terms PERSIST (never annealed); VP/placement
#      terms anneal but LATER (35M->50M) so sparse only kicks in once competent.
#   3. Evals add AB1+AB2, run slightly less often (300k) to absorb the cost.
# LR (1e-4) and net size unchanged (deferred, per discussion).
seed: 0
run_name: hexformer

env:
  map_type: BASE
  representation: mixed
  enable_maritime_trade: true

train:
  total_timesteps: 60_000_000
  n_envs: 6
  device: mps
  arch: boardcnn
  policy: spatial
  trunk: hexformer

  opponent_cfg:
    # Switched at 35.5M (2026-06-10): the adaptive ladder had a difficulty chasm —
    # weighted mastered (~0.9, redundant) and value hopeless (~0.03, noise). The
    # epsilon curriculum replaces both with an auto-calibrated eps-handicapped
    # value bot pinned to ~50% winrate (continuous difficulty dial that morphs
    # into the real value player as the agent improves).
    sampler: epsilon
    eps_base: value
    eps_init: 0.75                    # start fairly handicapped; calibrates from here
    eps_target: 0.5                   # keep agent winrate vs eps-bot ~50%
    eps_lr: 0.25                      # eps += lr * (target - wr) each eval
    eps_games: 12                     # calibration games per eval
    self_weight: 0.5                  # best-past self, unchanged
    eps_weight: 0.35                  # the main learning rung
    eps_floor_mix: {value: 0.10, alphabeta1: 0.05}   # keep real targets present
    best_past_self: true              # self-opponent tracks the BEST checkpoint
    self_fallback: weighted           # used until the first eval saves a snapshot
    snapshot_every_steps: 1_000_000   # (unused; best-past managed by eval callback)

  reward:
    enabled: true
    # Pushed back at 35.5M (epsilon-curriculum restart): keep dense >=10M more
    # from that point so the new opponent regime trains with full signal, then
    # taper 46M->56M (final ~4M pure sparse).
    anneal_start_step: 46_000_000
    anneal_end_step: 56_000_000
    win_reward: 500.0
    loss_reward: -500.0
    # --- annealed (VP / building / placement) ---
    vp_coef: 5.0
    city_bonus: 15.0                  # city ~ +20 total (encourage upgrades)
    settlement_bonus: 5.0             # expansion settlement ~ +10 total
    dev_play_reward: 2.0
    discard_penalty: -0.25            # stop the hoard (was -0.05)
    initial_placement_pip: 2.0        # strong pull to good spots (was 0.5)
    initial_placement_diversity: 0.0  # replaced by combined coverage below
    placement_coverage: {5: 10.0, 4: 4.0, 3: -2.0, 2: -5.0, 1: -9.0}
    per_turn_penalty: -0.05
    robber_target_opponent: 0.0       # legacy off (replaced by pip-based below)
    robber_blocks_high_pip: 0.0
    # --- persistent (efficiency / tactics; never annealed) ---
    road_cost: -0.05                  # tiny opportunity cost -> no dead-end spam
    longest_road_delta: 0.4           # reward roads that extend the longest path
    maritime_penalty: -0.1            # x (gives-1): 2:1->-0.1, 3:1->-0.2, 4:1->-0.3
    robber_block_opp_pip: 0.4         # +0.4 x tile_pip when opponent adjacent
    robber_block_self_pip: -0.6       # -0.6 x tile_pip when WE are adjacent
    robber_steal: 1.0                 # bonus on an actual steal

  ppo:
    gamma: 0.999
    gae_lambda: 0.95
    n_steps: 2048
    batch_size: 1024
    ent_coef: 0.02
    learning_rate: 1.0e-4
    n_epochs: 10
    clip_range: 0.2
    vf_coef: 0.5
    max_grad_norm: 0.5
    warmup_steps: 1_000_000
  checkpoint_every: 5_000_000

eval:
  callback_opponents: [weighted, value, alphabeta1, alphabeta2]   # no random; AB1/AB2 added
  callback_games: 20
  callback_every: 300_000           # slightly less often to absorb AB eval cost
  run_final_ladder: true
  final_opponents: [random, weighted, value, alphabeta1, alphabeta2]
  final_games: 500
  final_modes: ["1v1"]

wandb:
  project: catan-rl
  mode: online
  entity: null
