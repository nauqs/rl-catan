# Phase 3 — spatial pointer head + maritime (bank/port) trade re-enabled.
#
# Two changes vs phase2b:
#   1. policy: spatial — action logits for board locations (settlement/city/road/
#      robber) read the *local* conv features at those locations via HexEncoder,
#      instead of a position-blind pooled vector. SETTLEMENT and CITY get
#      separate per-node scorers.
#   2. env.enable_maritime_trade: true — the agent can trade with the bank, like
#      every benchmark bot. (Player<->player trades are not in the gym action
#      space at all.)
#
# Self-play >=50% of the run: the schedule ramps to self=0.55 by ~8M steps and
# holds for the remainder. Reward shaping / annealing / PPO hypers copy phase2b
# for comparability.
#
# Device/budget finalized from `scripts/profile_device.py --policy spatial`:
# MPS 266 sps vs CPU 90 sps (~3x) -> device: mps. Resource footprint kept
# deliberately comfortable for a shared local machine (M3 Pro, 11 cores):
# n_envs=6 leaves ~5 cores free; batch_size=1024 is fast on MPS at trivial memory.
seed: 0
run_name: phase3-spatial

env:
  map_type: BASE
  representation: mixed
  enable_maritime_trade: true       # <-- bank/port trade ON for the agent

train:
  total_timesteps: 50_000_000
  n_envs: 6                         # 6 of 11 cores -> comfortable headroom for other work
  device: mps                       # profiled: ~3x faster than CPU for the spatial head
  arch: boardcnn                    # ignored by the spatial policy (HexEncoder owns the trunk)
  policy: spatial                   # <-- the new pointer head

  opponent_cfg:
    sampler: scheduled
    # Brief heuristic bootstrap, then self-dominated for most of the run.
    schedule_start_step: 2_000_000
    schedule_end_step: 8_000_000
    start_mix:
      weighted: 0.5
      value: 0.3
      alphabeta1: 0.2
      # No 'self' early — snapshot is weak; reachable wins keep terminal +500 firing.
    end_mix:
      self: 0.55                    # self >=50% from ~8M onward
      value: 0.2
      alphabeta1: 0.2
      weighted: 0.05
    snapshot_every_steps: 2_000_000
    self_fallback: weighted

  reward:
    enabled: true
    anneal_start_step: 15_000_000
    anneal_end_step: 25_000_000
    win_reward: 500.0
    loss_reward: -500.0
    vp_coef: 5.0
    city_bonus: 10.0
    dev_play_reward: 2.0
    discard_penalty: -0.05
    robber_target_opponent: 1.0
    robber_blocks_high_pip: 0.2
    initial_placement_pip: 0.5
    initial_placement_diversity: 1.0
    per_turn_penalty: -0.05

  ppo:
    gamma: 0.999
    gae_lambda: 0.95
    n_steps: 2048
    batch_size: 1024                  # 6 envs x 2048 = 12288/rollout -> 12 minibatches (exact)
    ent_coef: 0.01
    learning_rate: 3.0e-4
    n_epochs: 10
    clip_range: 0.2
    vf_coef: 0.5
    max_grad_norm: 0.5
  checkpoint_every: 5_000_000        # ~10 milestone ckpts; model.zip overwritten each rollout for resume

eval:
  callback_opponents: [random, weighted, value]
  callback_games: 20
  callback_every: 200_000
  run_final_ladder: true
  final_opponents: [random, weighted, value, alphabeta1, alphabeta2]
  final_games: 500
  final_modes: ["1v1"]

wandb:
  project: catan-rl
  mode: online
  entity: null
