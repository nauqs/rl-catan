# Phase 2a — modular improvements over phase1-baseline-v2.
#
# Three modules ON by default:
#   1. Refined reward shaping (per-event retuned + new terms + annealing)
#   2. Mixed-opponent curriculum + frozen self-snapshot
#   3. Architecture: still BoardCNN (Phase 1 chose well at this size)
#
# Targets (vs Phase 1):
#   winrate vs Value:  9% -> >=20%
#   winrate vs AB2:    7% -> >=15%
#   cities/game vs Value:  0.5 -> >=1.0
seed: 0
run_name: phase2a-baseline

env:
  map_type: BASE
  representation: mixed

train:
  total_timesteps: 30_000_000
  n_envs: 8
  device: mps
  arch: boardcnn                   # one of: boardcnn, boardcnn_attn, mlp

  # Module 2 — opponent curriculum
  opponent_cfg:
    sampler: mixed_with_self
    mix:
      weighted: 0.4
      value: 0.3
      alphabeta1: 0.15
      self: 0.15
    snapshot_every_steps: 1_000_000
    self_fallback: weighted

  # Module 1 — reward refinements + annealing
  reward:
    enabled: true
    # Annealing: full dense until 15M, linear taper to 0 by 25M, then pure terminal.
    anneal_start_step: 15_000_000
    anneal_end_step: 25_000_000
    # Terminal (never annealed)
    win_reward: 500.0
    loss_reward: -500.0            # was 0 in Phase 1
    # Dense (annealed)
    vp_coef: 5.0
    city_bonus: 10.0               # was 2.5 — biggest reward refinement (data-driven)
    dev_play_reward: 2.0           # was 5.0 — reduce dev-card-spam incentive
    discard_penalty: -0.05         # was -0.3 — cut by 6x (data-driven)
    robber_target_opponent: 1.0    # only when robber actually targets an opponent
    robber_blocks_high_pip: 0.2    # × pip_sum × (1 if opponent adjacent else 0)
    initial_placement_pip: 0.5     # × pip_sum at each initial BUILD_SETTLEMENT
    initial_placement_diversity: 1.0   # × n_unique_resources at initial BUILD_SETTLEMENT
    per_turn_penalty: -0.05        # small push toward closing out

  ppo:
    gamma: 0.999
    gae_lambda: 0.95
    n_steps: 2048
    batch_size: 512
    ent_coef: 0.01
    learning_rate: 3.0e-4
    n_epochs: 10
    clip_range: 0.2
    vf_coef: 0.5
    max_grad_norm: 0.5
  checkpoint_every: 100_000

eval:
  callback_opponents: [random, weighted, value]
  callback_games: 20
  callback_every: 50_000
  run_final_ladder: true
  final_opponents: [random, weighted, value, alphabeta1, alphabeta2]
  final_games: 500
  final_modes: ["1v1"]

wandb:
  project: catan-rl
  mode: online
  entity: null
