# Phase 2a — modular improvements over phase1-baseline-v2 with curriculum schedule.
#
# Three modules ON by default:
#   1. Refined reward shaping (per-event retuned + new terms + annealing)
#   2. *Scheduled* opponent curriculum that ramps from weak fixed bots
#      at start -> heavy self-play + harder bots by end
#   3. Architecture: still BoardCNN (Phase 1 chose well at this size)
#
# Targets (vs Phase 1):
#   winrate vs Value:  9% -> >=20%
#   winrate vs VP (new):  unknown -> measure
#   winrate vs AB2:    7% -> >=15%
#   cities/game vs Value:  0.5 -> >=1.0
seed: 0
run_name: phase2a-baseline

env:
  map_type: BASE
  representation: mixed

train:
  total_timesteps: 30_000_000
  n_envs: 8
  device: mps
  arch: boardcnn
  policy: flat                     # Phase 2a stays flat; Phase 2b flips to factorized

  # Module 2 — scheduled opponent curriculum.
  # Start with mostly weak bots (random/weighted/vp); ramp self to majority by end.
  opponent_cfg:
    sampler: scheduled
    # First 5M env steps: pure start_mix (mostly weak — agent needs reachable wins
    # to keep terminal +500 firing while it learns basics).
    schedule_start_step: 5_000_000
    # Last 5M (25M -> 30M): pure end_mix (mostly self + value/ab1 — strong league).
    schedule_end_step: 25_000_000
    start_mix:
      random: 0.15
      weighted: 0.55
      value: 0.20
      alphabeta1: 0.10
      # No 'self' early — snapshot doesn't exist yet, would fall back to weighted anyway.
    end_mix:
      weighted: 0.05
      value: 0.15
      alphabeta1: 0.20
      self: 0.60                   # heavy self-play at end (Charlesworth-style)
    snapshot_every_steps: 1_000_000
    self_fallback: weighted

  # Module 1 — reward refinements + annealing
  reward:
    enabled: true
    anneal_start_step: 15_000_000  # full dense until 15M
    anneal_end_step: 25_000_000    # linear taper to 0 by 25M; last 5M pure terminal
    win_reward: 500.0
    loss_reward: -500.0
    vp_coef: 5.0
    city_bonus: 10.0
    dev_play_reward: 2.0
    discard_penalty: -0.05
    robber_target_opponent: 1.0
    robber_blocks_high_pip: 0.2
    initial_placement_pip: 0.5
    initial_placement_diversity: 1.0
    per_turn_penalty: -0.05

  ppo:
    gamma: 0.999
    gae_lambda: 0.95
    n_steps: 2048
    batch_size: 512
    ent_coef: 0.01
    learning_rate: 3.0e-4
    n_epochs: 10
    clip_range: 0.2
    vf_coef: 0.5
    max_grad_norm: 0.5
  checkpoint_every: 100_000

eval:
  # In-training cheap ladder (also gets vp now).
  callback_opponents: [random, weighted, value]
  callback_games: 20
  callback_every: 50_000
  run_final_ladder: true
  final_opponents: [random, weighted, value, alphabeta1, alphabeta2]
  final_games: 500
  final_modes: ["1v1"]

wandb:
  project: catan-rl
  mode: online
  entity: null
