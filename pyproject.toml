[project]
name = "catan-rl"
version = "0.1.0"
description = "Reinforcement-learning agents for Settlers of Catan, benchmarked against Catanatron"
requires-python = "==3.11.*"
license = "MIT"
authors = [{ name = "Arnau Quindós" }]
dependencies = [
    "catanatron[gym] @ git+https://github.com/bcollazo/catanatron.git",
    "stable-baselines3>=2.3,<3",
    "sb3-contrib>=2.3,<3",
    "torch>=2.2",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "wandb",
    "tqdm",
    "tensorboard>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catan_rl"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
